[package]
name = "trinity"
version = "0.1.0"
edition = "2024"

[lib]
name = "trinity"
path = "src/lib.rs"

[[bin]]
name = "trinity"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures = "0.3.34"
matrix-sdk = "0.19.1"
notify = "8.2.0"
rand = "0.10.3"
redb = "4.4.0"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
signal-hook = "0.4.5"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wasmtime = { version = "50.0.0", features = ["component-model"] }
directories = "6.0.0"
rayon = "1.12.0"
mime = "0.3.17"
